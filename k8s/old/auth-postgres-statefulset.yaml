apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: auth-postgres
  namespace: lkequiz-local
  labels:
    app: auth-postgres
    group: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-postgres
  serviceName: "auth-postgres"
  template:
    metadata:
      labels:
        app: auth-postgres
        type: db
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
              name: auth-postgres
          envFrom:
            - configMapRef:
                name: auth-postgres-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-postgres-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
          - name: auth-postgres-data
            mountPath: /var/lib/postgresql/data
          resources:
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
      - name: auth-postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: standard # Or your preferred storage class
      resources:
        requests:
          storage: 1Gi