apiVersion: v1
kind: Service
metadata:
  name: gateway-svc
  namespace: kamilmucik-lkequiz-maestro
spec:
  selector:
    app: gateway-svc
  # type: LoadBalancer
  ports:
   -  protocol: TCP
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-svc-config
data:
  dev.env: |
    PORT=:3000
    AUTH_SVC_URL=auth-svc.kamilmucik-lkequiz-maestro.svc.cluster.local:50051
    DEPARTMENT_SVC_URL=question-svc.kamilmucik-lkequiz-maestro.svc.cluster.local:50055
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-svc
  namespace: kamilmucik-lkequiz-maestro
  labels:
    app: gateway-svc
    group: svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-svc
  template:
    metadata:
      labels:
        app: gateway-svc
        type: svc
    spec:
      containers:
        - name: gateway-svc
          image: kamilmucik/lkequiz-gateway-svc:1.0
          ports:
            - containerPort: 3000
          readinessProbe:
            initialDelaySeconds: 10
            httpGet:
              path: "/health"
              port: 8080
          livenessProbe:
            initialDelaySeconds: 10
            httpGet:
              path: "/health"
              port: 8080
          volumeMounts:
            - name: conf
              mountPath: /pkg/config/envs
              readOnly: false
      volumes:
        - name: conf
          configMap:
            name: gateway-svc-config