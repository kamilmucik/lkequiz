apiVersion: v1
kind: Service
metadata:
  name: question-db
  namespace: kamilmucik-lkequiz-maestro
spec:
  selector:
    app: question-postgres
  type: LoadBalancer
  ports:
   -  protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Secret
metadata:
  name: question-postgres-secret
  labels:
    group: db
type: Opaque
data:
  POSTGRES_DB: cG9zdGdyZXM=
  POSTGRES_USER: cXVlc3Rpb25fZGI=
  POSTGRES_PASSWORD: cG9zdGdyZXM=
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: question-postgres
  namespace: kamilmucik-lkequiz-maestro
  labels:
    app: question-postgres
    group: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: question-postgres
  serviceName: "question-postgres"
  template:
    metadata:
      labels:
        app: question-postgres
        type: db
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: question-db
          image: docker.io/bitnami/postgresql:15
          ports:
            - containerPort: 5432
              name: quest-postgres
          env:
            - name: POSTGRESQL_DATABASE
              value: postgres
            - name: POSTGRESQL_PASSWORD
              value: postgres
            - name: POSTGRESQL_USERNAME
              value: question_user
          # - name: POSTGRES_PASSWORD
          #   valueFrom:
          #     secretKeyRef:
          #       name: question-postgres-secret
          #       key: POSTGRES_PASSWORD
          # - name: POSTGRES_USER
          #   valueFrom:
          #     secretKeyRef:
          #       name: question-postgres-secret
          #       key: POSTGRES_USER
          volumeMounts:
            - name: postgres-storage
              mountPath: /bitnami/postgresql
      volumes:
      - name: postgres-storage
        emptyDir: {}