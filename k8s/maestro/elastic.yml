apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: kamilmucik-lkequiz-maestro
spec:
  selector:
    matchLabels:
      component: elasticsearch
  template:
    metadata:
      labels:
        component: elasticsearch
    spec:
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:7.17.28
        env:
        - name: cluster.name
          value: docker-cluster
        - name: discovery.type
          value: single-node
        - name: bootstrap.memory_lock
          value: true
        ports:
        - containerPort: 9200
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: 800m
            memory: 1.5Gi
          requests:
            cpu: 500m
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: kamilmucik-lkequiz-maestro
  labels:
    service: elasticsearch
spec:
  type: LoadBalancer
  selector:
    component: elasticsearch
  ports:
  - port: 9200
    targetPort: 9200