apiVersion: v1
kind: Service
metadata:
  name: auth-db
  namespace: kamilmucik-lkequiz-maestro
spec:
  selector:
    app: auth-postgres
  type: LoadBalancer
  ports:
   -  protocol: TCP
      port: 5433
      targetPort: 5432
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-postgres-secret
  labels:
    group: db
type: Opaque
data:
  POSTGRES_DB: cG9zdGdyZXM=
  POSTGRES_USER: dXNlcl9kYg==
  POSTGRES_PASSWORD: cG9zdGdyZXM=
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: auth-postgres
  namespace: kamilmucik-lkequiz-maestro
  labels:
    app: auth-postgres
    group: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-postgres
  serviceName: "auth-postgres"
  template:
    metadata:
      labels:
        app: auth-postgres
        type: db
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: auth-postgres
          image: docker.io/bitnami/postgresql:15
          ports:
            - containerPort: 5432
              name: auth-postgres
          env:
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: auth-postgres-secret
                key: POSTGRES_PASSWORD
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: auth-postgres-secret
                key: POSTGRES_USER
          volumeMounts:
            - name: postgres-storage
              mountPath: /bitnami/postgresql
      volumes:
      - name: postgres-storage
        emptyDir: {}