apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-svc
  namespace: lkequiz-local
  labels:
    app: gateway-svc
    group: svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-svc
  template:
    metadata:
      labels:
        app: gateway-svc
        type: svc
    spec:
      containers:
        - name: gateway-svc
          image: kamilmucik/lkequiz-gateway-srv:1.0
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: conf
              mountPath: /pkg/config/envs
              readOnly: false
      volumes:
        - name: conf
          configMap:
            name: gateway-svc-config