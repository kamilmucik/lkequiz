apiVersion: apps/v1
kind: Deployment
metadata:
  name: question-svc
  namespace: lkequiz-local
  labels:
    app: question-svc
    group: svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: question-svc
  template:
    metadata:
      labels:
        app: question-svc
        type: svc
    spec:
      containers:
        - name: question-svc
          image: kamilmucik/lkequiz-question-srv:1.0
          ports:
            - containerPort: 50055
          volumeMounts:
            - name: conf
              mountPath: /pkg/config/envs
              readOnly: false
      volumes:
        - name: conf
          configMap:
            name: question-svc-config