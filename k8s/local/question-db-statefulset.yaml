apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: question-postgres
  namespace: lkequiz-local
spec:
  selector:
    matchLabels:
      app: question-postgres
  serviceName: "question-postgres"
  replicas: 1
  template:
    metadata:
      labels:
        app: question-postgres
    spec:
      containers:
      - name: question-db
        image: docker.io/bitnami/postgresql:15
        ports:
        - containerPort: 5432
          name: postgres
        env:
          - name: POSTGRESQL_DATABASE
            value: postgres
          - name: POSTGRESQL_PASSWORD
            value: postgres
          - name: POSTGRESQL_USERNAME
            value: question_user
          # - name: POSTGRES_DB
          #   valueFrom:
          #     secretKeyRef:
          #       name: question-postgres-secret
          #       key: POSTGRES_DB
          # - name: POSTGRES_USER
          #   valueFrom:
          #     secretKeyRef:
          #       name: question-postgres-secret
          #       key: POSTGRES_USER
          # - name: POSTGRES_PASSWORD
          #   valueFrom:
          #     secretKeyRef:
          #       name: question-postgres-secret
          #       key: POSTGRES_PASSWORD
        volumeMounts:
            - name: postgres-storage
              mountPath: /bitnami/postgresql
      volumes:
        - name: postgres-storage
          emptyDir: {}
      #   volumeMounts:
      #   - name: question-postgres-data
      #     mountPath: /var/data/pgdata
      # volumes:
      # - name: question-postgres-data
      #   persistentVolumeClaim:
      #     claimName: question-postgres-data-pvc