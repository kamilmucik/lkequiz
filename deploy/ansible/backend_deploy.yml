---
- name: Deploy service package
  hosts: webserver
  become_user: root
  tasks:
    - name: Delete content & directory
      ansible.builtin.file:
        state: absent
        path: /tmp/lkequiz/
    - name: Creates directory
      file:
        path: /tmp/lkequiz
        state: directory
        mode: 0775
    - name: Transfer the script
      copy: src=backend_deploy.sh dest=/tmp/lkequiz/ mode=0777
      tags: lsout
      register: myshell_output
    - name: Copy Artifacts
      copy: src=artifacts dest=/tmp/lkequiz mode=0755
      tags: lsout
      register: myshell_output
#    - name: Execute the script
#      command: timeout 240 sh /tmp/lkequiz/backend_deploy.sh {{filename}} {{module}} {{version}} {{old_version}}
#      become: yes
#      become_method: sudo
#      become_user: root
#      tags: lsout
#      register: myshell_output
    - name: Copy the output to a local file
      copy:
        content: "{{ myshell_output.stdout }}"
        dest: "/Users/kamilmuc/ws/lke/deploy/ansible/logs/report_env_{{ ansible_host }}_{{ inventory_hostname }}.txt"
      delegate_to: localhost
