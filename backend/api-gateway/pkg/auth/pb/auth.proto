syntax = "proto3";

package auth;

option go_package = "./pkg/auth/pb";

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse) {}
  rpc Login(LoginRequest) returns (LoginResponse) {}
  rpc Validate(ValidateRequest) returns (ValidateResponse) {}

  rpc PasswordRestore(PasswordRestoreRequest) returns (PasswordRestoreResponse) {}
  rpc UserInfo(UserInfoRequest) returns (UserInfoResponse) {}
}


message SessionResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
}
// Register

message RegisterRequest {
  string email = 1;
  string password = 2;
}

message RegisterResponse {
  int64 status = 1;
  string error = 2;
  SessionResponse session = 3;
  LoginUserDataResponse user = 4;
}

// Login
message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginUserDataResponse {
  int64 id = 1;
  string name = 2;
  string email = 3;
}

message LoginResponse {
  int64 status = 1;
  string error = 2;
  SessionResponse session = 3;
  LoginUserDataResponse user = 4;
}

// Validate
message ValidateRequest { string token = 1; }

message ValidateResponse {
  int64 status = 1;
  string error = 2;
  int64 userId = 3;
}

//PasswordRestore
message PasswordRestoreRequest {
  string email = 1;
}

message PasswordRestoreResponse {
  int64 status = 1;
  string error = 2;
}

//UserInfo
message UserInfoRequest {
  int64 userId = 1;
}

message UserInfoResponse {
  int64 status = 1;
  string error = 2;
  LoginUserDataResponse user = 3;
}
