syntax = "proto3";

package profile;

option go_package = "./pkg/profile/pb";

service ProfileService { 
  rpc FindOne(FindOneRequest) returns (FindOneResponse) {}
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse) {}
}

// FindOne
message FindOneData {
  int64 id = 1;
  string fullname = 2;
  string username = 3;
  string profile_image_url = 4;
  bool onboarding_completed = 5;
}

message FindOneRequest { int64 user_id = 1; }

message FindOneResponse {
  int64 status = 1;
  string error = 2;
  FindOneData data = 3;
}

// UpdateProfile
message UpdateProfileRequest {
  int64 id = 1;
  int64 user_id = 2;
  string fullname = 3;
  string username = 4;
  string profile_image_url = 5;
  bool onboarding_completed = 6;
}

message UpdateProfileResponse {
  int64 status = 1;
  string error = 2;
  int64 id = 3;
}